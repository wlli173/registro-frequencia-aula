<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Diário Escolar</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/lista.css" />
  </head>
  <body>
    <nav class="menu">
      <div class="menu-container">
        <span class="logo">📘 Diário Escolar</span>
        <div class="links">
          <a href="/professor.html">Professor</a>
          <a href="/coordenacao-ws.html">Coordenação WS</a>
          <a href="/coordenacao-pooling.html">Coordenação pooling</a>
          <a href="/coordenacao-long.html">Coordenação Long</a>
        </div>
      </div>
    </nav>

    <main class="container">
      <h2>Coordenação - pooling</h2>
      <ul id="lista-pooling" class="lista-presenca"></ul>

      <script type="module">
        import { atualizarLista } from "./utils/render.js";

        async function atualizar() {
          const res = await fetch("/diario");
          const diario = await res.json();

          atualizarLista(diario, "lista-pooling");
        }

        setInterval(atualizar, 3000);
        atualizar();
      </script>
    </main>
  </body>
</html>
