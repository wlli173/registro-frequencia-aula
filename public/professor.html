<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Diário Escolar</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/lista.css" />
  </head>
  <body>
    <nav class="menu">
      <div class="menu-container">
        <span class="logo">📘 Diário Escolar</span>
        <div class="links">
          <a href="/professor.html">Professor</a>
          <a href="/coordenacao-ws.html">Coordenação WS</a>
          <a href="/coordenacao-pooling.html">Coordenação Polling</a>
          <a href="/coordenacao-long.html">Coordenação Long</a>
        </div>
      </div>
    </nav>

    <main class="container">
      <h2>Diário - Professor</h2>

      <button onclick="novaAula()">Criar Aula de Hoje</button>
      <button onclick="marcarTodos()">Marcar Todos como Presentes</button>
      <button onclick="removerAula()">Remover Aula de Hoje</button>

      <ul id="lista" class="lista-presenca"></ul>

        <script type="module">
          import { atualizarLista } from "./utils/render.js";

        async function carregar() {
          const res = await fetch("/diario");
          const diario = await res.json();

          atualizarLista(diario, "lista", {
            modoProfessor: true,
            aoMarcar: async (matricula, status) => {
              await fetch("/marcar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ matricula, status }),
              });
              carregar();
            },
          });
        }

        window.novaAula = async function () {
          await fetch("/nova-aula", { method: "POST" });
          carregar();
        };

        window.removerAula = async function () {
          const data = new Date().toISOString().split("T")[0];
          await fetch("/aula/" + data, { method: "DELETE" });
          carregar();
        };

        window.marcarTodos = async function () {
          const data = new Date().toISOString().split("T")[0];
          await fetch("/marcar-todos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ data, status: "Presente" }),
          });
          carregar();
        };

        carregar();
      </script>
    </main>
  </body>
</html>
