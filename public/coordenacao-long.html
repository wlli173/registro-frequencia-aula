<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Diário Escolar</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/lista.css" />
  </head>
  <body>
    <nav class="menu">
      <div class="menu-container">
        <span class="logo">📘 Diário Escolar</span>
        <div class="links">
          <a href="/professor.html">Professor</a>
          <a href="/coordenacao-ws.html">Coordenação WS</a>
          <a href="/coordenacao-pooling.html">Coordenação pooling</a>
          <a href="/coordenacao-long.html">Coordenação Long</a>
        </div>
      </div>
    </nav>

    <main class="container">
      <h2>Coordenação - Long pooling</h2>
      <ul id="lista-long" class="lista-presenca"></ul>

      <script type="module">
        import { atualizarLista } from "./utils/render.js";

        async function fetchDiario() {
          try {
            const res = await fetch("/diario");
            const dados = await res.json();
            atualizarLista(dados, "lista-long");
          } catch (err) {
            console.log("Erro ao buscar diário");
          }
        }

        async function escutar() {
          try {
            const res = await fetch("/long-poll");
            const dados = await res.json();

            if (!dados.timeout) {
              atualizarLista(dados, "lista-long");
              console.log("Atualizado via long pooling");
            }
          } catch (err) {
            console.log("Erro, tentando novamente...");
            await new Promise((r) => setTimeout(r, 2000));
          }

          escutar(); // reconecta depois que termina
        }

        window.addEventListener("load", () => {
          fetchDiario();
          escutar();
        });
      </script>
    </main>
  </body>
</html>
