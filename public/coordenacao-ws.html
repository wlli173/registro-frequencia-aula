<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Diário Escolar</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/lista.css" />
  </head>
  <body>
    <nav class="menu">
      <div class="menu-container">
        <span class="logo">📘 Diário Escolar</span>
        <div class="links">
          <a href="/professor.html">Professor</a>
          <a href="/coordenacao-ws.html">Coordenação WS</a>
          <a href="/coordenacao-pooling.html">Coordenação pooling</a>
          <a href="/coordenacao-long.html">Coordenação Long</a>
        </div>
      </div>
    </nav>

    <main class="container">
      <h2>
        Coordenação - WebSocket
        <span id="status">🔴</span>
      </h2>

      <button id="btnConectar">Conectar</button>
      <button id="btnDesconectar" disabled>Desconectar</button>

      <ul id="lista-ws" class="lista-presenca"></ul>

      <script type="module">
        import { atualizarLista } from "./utils/render.js";

        const statusSpan = document.getElementById("status");
        const btnConectar = document.getElementById("btnConectar");
        const btnDesconectar = document.getElementById("btnDesconectar");

        let socket = null;

        function conectar() {
          if (socket && socket.readyState === WebSocket.OPEN) return;

          socket = new WebSocket("ws://localhost:3000");

          socket.addEventListener("open", () => {
            atualizarStatus("🟢", "Conectado");
            btnConectar.disabled = true;
            btnDesconectar.disabled = false;
          });

          socket.addEventListener("message", (event) => {
            try {
              const diario = JSON.parse(event.data);
              atualizarLista(diario, "lista-ws");
            } catch (erro) {
              console.error("Erro ao processar mensagem:", erro);
            }
          });

          socket.addEventListener("close", () => {
            atualizarStatus("🔴", "Desconectado");
            btnConectar.disabled = false;
            btnDesconectar.disabled = true;
          });
        }

        function desconectar() {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.close(1000, "Encerrado pelo cliente");
          }
        }

        function atualizarStatus(icone, texto) {
          statusSpan.textContent = icone;
          statusSpan.title = texto;
        }

        btnConectar.addEventListener("click", conectar);
        btnDesconectar.addEventListener("click", desconectar);
      </script>
    </main>
  </body>
</html>
